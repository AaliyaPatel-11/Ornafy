<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Store Signup</title>
    <style>
        body {
            background: url('https://cdn.alromaizan.com/image/upload/v1679132058/media/blog/what-gold-jewellery-to-wear-in-hot-weather.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Great Vibes', cursive;
            margin: 0;
        }
    
        .signup-container {
            background: rgb(230, 220, 218);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }
    
        h2 {
            color: #B5828C;
            font-size: 22px;
            margin-bottom: 15px;
        }
    
        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #E5989B;
            border-radius: 6px;
            font-size: 14px;
        }
    
        button {
            background: #E5989B;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            margin-top: 8px;
        }
    
        button:hover {
            background: #B5828C;
        }
    
        .login-link {
            margin-top: 12px;
            font-size: 13px;
            font-family: 'Arial', sans-serif;
        }
    
        .login-link a {
            color: #B5828C;
            text-decoration: none;
            font-weight: bold;
            margin-left: 4px;
        }
    
        .verification-code {
            display: none;
        }
    </style>
    
</head>
<script>

let verified = false;

function showVerification(){

let contact = document.getElementById("contact").value;
let errorMsg = document.getElementById("errorMsg");

let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let phoneRegex = /^[0-9]{10}$/;

if(emailRegex.test(contact) || phoneRegex.test(contact)){
verified = true;
errorMsg.style.color="green";
errorMsg.innerText="Verified ✓";
}

else{
errorMsg.style.color = "red";
errorMsg.innerText = "Enter a valid email or 10-digit phone number";
}

}

async function signupUser() {

if(!verified){
errorMsg.innerText = "Please verify your email or phone first";
return;
}

let firstName = document.getElementById("firstName").value;
let lastName = document.getElementById("lastName").value;
let contact = document.getElementById("contact").value;
let password = document.getElementById("password").value;
let confirmPassword = document.getElementById("confirmPassword").value;

let errorMsg = document.getElementById("errorMsg");

if(password !== confirmPassword){
errorMsg.innerText = "Passwords do not match";
return;
}

let passwordRegex = /^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;

if(!passwordRegex.test(password)){
errorMsg.innerText =
"Password must contain 8 characters, 1 capital letter, 1 number and 1 special symbol.";
return;
}

let response = await fetch("https://ornafy.onrender.com/signup",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
firstName:firstName,
lastName:lastName,
contact:contact,
password:password
})
});

let data = await response.json();

if(data.status === "success"){
alert("Signup successful!");
window.location.href="login.html";
}
else{
errorMsg.innerText = data.message;
}

}

</script>
<body>
    <div class="signup-container">
        <h2>Ornafy Sign Up</h2>
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="contact" placeholder="Email or Phone Number" required>
        <button type="button" onclick="showVerification()">Verify</button>
        <div id="verify-section" class="verification-code">
            <input type="text" placeholder="Enter Verification Code" required>
        </div>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Re-enter Password" required>
        <p id="errorMsg" style="color:red; font-size:13px;"></p>
        <button type="button" onclick="signupUser()">Sign Up</button>
        <p class="login-link">Already have an account? <a href="login.html">Login</a></p>
    </div>
</body>
</html>
